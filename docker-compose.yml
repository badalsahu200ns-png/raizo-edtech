version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: raizo_api
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///raizo_learning.db}
    volumes:
      - ./raizo_learning.db:/app/raizo_learning.db
      - ./database/sample_resumes:/app/database/sample_resumes

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: raizo_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - api
